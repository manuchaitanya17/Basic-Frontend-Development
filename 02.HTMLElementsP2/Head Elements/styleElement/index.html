<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>replit</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
  
  <!-- A. STYLE ELEMENT- INTRODUCTION  
    1. The <style> element is used to write Internal CSS for the page. 
  
    2. The <style> element allows you to define CSS rules directly only within the HTML current document. 
       This is especially useful for small projects or when you want to quickly apply styles without 
       creating an External CSS File.
  
    3. Style Element consists of: 
         a) Selector- Which selects the element in which the style has to be done.  
         b) Declaration Block- The declaration block contains one or more Property-Value Pairs separated by 
            semicolons.  -->
  
 

  
  <style>
    h1 {
      color: red;
      font-family: Verdana, Geneva, Tahoma, sans-serif;
    }

    h2 {
      color: blue;
      font-family: Georgia, 'Times New Roman', Times, serif;
    }
    
  </style>
</head>

<body>
  <div>
    <h1> This is Me!</h1>
    <h2>This is You!</h2>
  </div>

  <script src="script.js"></script>
  <script src="https://replit.com/public/js/replit-badge-v2.js" theme="dark" position="bottom-right"></script>
</body>

</html>
