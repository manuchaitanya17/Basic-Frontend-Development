<!-- CHAPTER-1- HTML HEAD ELEMENT -->

<!DOCTYPE html>
<html>

<!-- A. HEAD ELEMENT- INTRODUCTION
    1. The <head> element is a container for Metadata (Data about Data) and is placed between the <html> opening tag 
       and the <body> opening tag.
    2. HTML Metadata is data about the HTML document. Metadata is not displayed.
    3. The HTML <head> element is a container for the following elements: 
        a) <title>
        b) <style>
        c) <meta>
        d) <link>
        e) <script>
        f) <base>  
     4. Head Element Overview: --> 
  
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Page Title</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <meta name="description" content="A brief description of your page">
    <meta name="keywords" content="keywords, related, to, your, page">
    <meta name="author" content="Your Name">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
  
<body>
  <script src="script.js"></script>
  <script src="https://replit.com/public/js/replit-badge-v2.js" theme="dark" position="bottom-right"></script>
</body>

</html>
