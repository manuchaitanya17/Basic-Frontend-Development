  <!-- A. BASE ELEMENT- INTRODUCTION
    1. The HTML <base> tag is used to specify a base URL, or target, for relative links.
       This URL will be the base URL for every link on the page and will be prefixed
       before each of them. For example, if the URL specified by the base tag is “www.xyz.com”
       then every other URL on the page will be prefixed by, “www.xyz.com/”.
    2. The <base> tag must have either an href or a target attribute present, or both. 
    3. There can only be one single <base> element in a document. --> 
  
  <base href="https://www.instagram.com/" target="_blank">
