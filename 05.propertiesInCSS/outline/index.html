<!-- CHAPTER-6 OUTLINE PROPERTY IN CSS -->

<!-- A. OUTLINE-INTRODUCTION
1. Use to specify the style, width, and color of an element's outline. 
2. An outline is a line that is drawn around elements, OUTSIDE the borders, to make the 
   element "stand out". -->


<!-- B. OUTLINE STYLE
  1. Formula- outline-style:value;
  2. The Value are:
      - dotted - Defines a dotted outline
      - dashed - Defines a dashed outline
      - solid - Defines a solid outline
      - double - Defines a double outline
      - groove - Defines a 3D grooved outline Outer-Dark, Inner-Light Color
      - ridge - Defines a 3D ridged outline Outer-Light, Inner-Dark Color
      - inset - Defines a 3D inset outline The effect depends on the outline value
      - outset - Defines a 3D outset outline The effect depends on the outline value
      - none - Defines no outline
      - hidden - Defines a hidden outline
  3. None of the other outline properties will work without setting the outline style. -->



<!-- C. OUTLINE WIDTH
  1. The outline-width property specifies the width of the four outline. 
  2. The width can be set as a specific size (in px, pt, cm, em, etc) or by using one of the three
     pre-defined values: thin, medium, or thick. -->



<!-- D. OUTLINE COLORS
  1. The border-color property is used to set the color of the four outline.
  2. Value- invert performs a color inversion (which ensures that the outline is visible,
     regardless of color background). -->


<!-- E. OUTLINE OFFSET -->
<!-- 1. The outline-offset property specifies the width of the space between the outline and the border.
     2. By default, the outline is drawn just outside the border edge of an element. Positive values for
        outline-offset increase the space between the outline and the border, pushing the outline further
        away from the element. Negative values, on the other hand, decrease the space between the outline
        and the border, pulling the outline closer to the element. -->


<!-- E. OUTLINE SHORTHAND PROPERTY
1. The outline property is a shorthand property for the following individual outline properties:
   outline-width, outline-style (required), outline-color -->


<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>replit</title>
  <link href="style.css" rel="stylesheet" type="text/css" />

  <style>
    
    p {
      margin: 30px;
      border: 1px solid black;
      outline: 1px solid red;
      outline-offset: 15px;
    }

    .p1{
      border: 1px solid black;
      outline-style: solid;
      outline-color: red;
      outline-width: thin;
    }

    .p2{
      outline: 5px solid yellow;
    }
  </style>
</head>

<body>

  <p>
    This is Paragraph.
  </p>

  <div class="p1">This is Class p1</div>
  <div class="p2">This is Class p2</div>
