<!-- CHAPTER-4 PADDING PROPERTY IN CSS -->

<!-- A. PADDING-INTRODUCTION
  1. Padding is used to create space around an element's content, INSIDE of any defined borders.
  2. Values to padding property is always regarding length. Can be specified as: 
      - length - specifies a padding in px, pt, cm, etc.
      - % - specifies a padding in % of the width and height of the containing element.
      - inherit - specifies that the padding should be inherited from the parent element's padding.
  3. Negative values are not allowed. -->



<!-- B. PADDING INDIVISUAL SIDES: 
  1. Property: CSS has properties for specifying the padding for each side of an element:
     padding-top, padding-right, padding-bottom, padding-left 
  2. Value: Same like borders values also specify the padding for each side of the element. 
      Refer Chapter-2 -->
