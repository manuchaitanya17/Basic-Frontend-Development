<!DOCTYPE html>
<html>
<head>
<style>
.grid-container {
  display: grid;
  grid-template-columns: auto auto auto auto auto auto;
  gap: 10px;
  background-color: #2196F3;
  padding: 10px;
}

.grid-container > div {
  background-color: rgba(255, 255, 255, 0.8);
  text-align: center;
  padding: 20px 0;
  font-size: 30px;
}

.item1 {
   /* To span it from Column 1 to Column 4 */

  /* End */
  grid-column: 1 / 5;

  /* Span */
  grid-column: 1 / span 4;

   /* To span it from Row 1 to Row 4 */
  grid-row: 1 / 4;
  grid-row: 1 / span 3;


  /* Shorthand-> RS/CS/RE+1/CE+1 */
  grid-area: 1 / 2 / 5 / 6;
  grid-area: 1 / 2 / span 4 / span 5;

  
  /* Grid Area- Naming a List */
  .item1 {
    grid-area: myArea;
  }


}
</style>
</head>
<body>

<h1>The grid-column Property</h1>

<p>Use the <em>grid-column</em> property to specify where to place an item.</p>
<p>Item1 will start on column 1 and end before column 5:</p>

<div class="grid-container">
  <div class="item1">1</div>
  <div class="item2">2</div>
  <div class="item3">3</div>  
  <div class="item4">4</div>
  <div class="item5">5</div>
  <div class="item6">6</div>
  <div class="item7">7</div>
  <div class="item8">8</div>  
  <div class="item9">9</div>
  <div class="item10">10</div>
  <div class="item11">11</div>
  <div class="item12">12</div>
  <div class="item13">13</div>
  <div class="item14">14</div>
  <div class="item15">15</div>
</div>

</body>
</html>
