<!-- CHAPTER-10- PICTURE ELEMENT -->

<!-- A. HTML PICTURE- INTRODUCTION
    1. The HTML <picture> element allows us to display different pictures for different devices or screen sizes.
    2. The HTML <picture> element gives web developers more flexibility in specifying image resources.
    3. The <picture> element contains one or more <source> elements, each referring to different images through
       the srcset attribute. This way the browser can choose the image that best fits the current view and/or 
       device.
    4. Each <source> element has a media attribute that defines when the image is the most suitable.
    5. There are two main purposes for the <picture> element:
      I. Bandwidth: If we have a small screen or device, it is not necessary to load a large image file. 
         The browser will use the first <source> element with matching attribute values, and ignore any of the following elements.
      II. Format Support: Some browsers or devices may not support all image formats. By using the <picture> element, 
          we can add images of all formats, and the browser will use the first format it recognizes, and ignore any of the following elements. 
    6. The browser will use the first <source> element with matching attribute values, and ignore any following <source> elements. 
    7. Always specify an <img> element as the last child element of the <picture> element. The <img> element is used by browsers 
       that do not support the <picture> element, or if none of the <source> tags match. -->


<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>replit</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>


  <!-- B. COMPONENTS OF PICTURE ELEMENT  
    1. Source: Element refers to different images through the srcset attribute. This way the browser can choose the image 
       that best fits the current view and/or device.
  
    2. Image:                                            -->


  <picture>
    <source media="(min-width: 650px)" srcset="img_food.jpg">
    <source media="(min-width: 465px)" srcset="img_car.jpg">
    <img src="img_girl.jpg" style="width:auto;">
  </picture>


  
  <script src="script.js"></script>
  <script src="https://replit.com/public/js/replit-badge-v2.js" theme="dark" position="bottom-right"></script>
</body>

</html>
