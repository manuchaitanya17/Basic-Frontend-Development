  <!-- A. HTML HEADING 
      1. HTML headings are titles or subtitles that we want to display on a webpage. 
      2. HTML headings are defined with the <h1> to <h6> tags.
      3. <h1> defines the most important heading. <h6> defines the least important heading. 
      4. Headings are Block, Non-Empty Elements, Semantic for Text.
      5. Search engines use the headings to index the structure and content of your web pages.
      7. Use HTML headings for headings only. Don't use headings to make text BIG or BOLD.
      8. Each HTML heading has a default size. -->

  <h1>Lensshub</h1>
  <h2>Lensshub</h2>
  <h3>Lensshub</h3>
  <h4>Lensshub</h4>
  <h5>Lensshub</h5>
