<!-- CHAPTER-16 BLOCKQUOTE ELEMENT -->

<!-- A. INTRODUCTION TO BLOCKQUOTE ELEMENT
    1. The <blockquote> element in HTML is used to indicate that the enclosed text is a longer
       quotation from another source. 
    2. It's typically rendered with indentation or some other visual cue to distinguish it from
       the surrounding text. -->


<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>replit</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <blockquote>
      This is the quoted text. It might be from a book, article, speech, or any other source.
    </blockquote>
  <script src="script.js"></script>
</body>

</html>
