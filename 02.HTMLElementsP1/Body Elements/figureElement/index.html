<!-- CHAPTER-9- FIGURE ELEMENT -->

<!-- A. HTML FIGURE- INTRODUCTION
    1. The <figure> tag specifies self-contained content, like illustrations, diagrams, photos, code           
       listings, etc. It's a Block Element.
    2. While the content of the <figure> element is related to the main flow, its position is 
       independent of the main flow, and if removed it should not affect the flow of the document.
    3. The <figcaption> element is used to add a caption for the <figure> element. -->





<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>replit</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
  
 <!-- B. ATTRIBUTES OF FIGURE ELEMENT
     NOTE: No such different attribute is used in figure tag, but all of the image tag can be used. -->

  
  <figure>
    <img src="picture.jpg" alt="Trulli" width="100%">
    <figcaption align="center">Marguerite.</figcaption>
  </figure>



  
  <script src="script.js"></script>
  <script src="https://replit.com/public/js/replit-badge-v2.js" theme="dark" position="bottom-right"></script>
</body>

</html>
