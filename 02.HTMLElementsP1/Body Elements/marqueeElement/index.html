<!-- CHAPTER-17 MARQUEE ELEMENT -->

<!-- A. INTRODUCTION TO MARQUEE ELEMENT
    1.  <marquee> tag in HTML that helps to create scrolling text or image on a webpage. It scrolls
       either from horizontally left to right or right to left, or vertically from top to bottom or
       bottom to top. 
    2. Its a Block Element. -->


<!-- B. ATTRIBUTES USED IN MARQUEE ELEMENT
    1. behavior (scroll, slide, alternate): Controls the scrolling behavior. However, using 
       animations or JavaScript provides more accessible and controllable alternatives.
    2. bgcolor (color name or hex code): Sets the background color. Consider background styles in 
       CSS for better accessibility.
    3. direction (left, right, up, down): Specifies the scrolling direction. Use CSS transforms or 
       animations for directional movement.
    4. height (pixels or percentage): Defines the height of the marquee. CSS height and overflow 
       properties offer better control. -->
